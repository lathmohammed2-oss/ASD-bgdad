
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAITH REVERB PRO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101114;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#17181d;padding:22px;
 border-bottom:1px solid #292a30;
}
.logo{font-size:25px;font-weight:bold;letter-spacing:2px}
.logo span{color:#e33b42}
.sub{color:#777;font-size:12px;margin-top:6px}
.container{padding:18px;max-width:650px;margin:auto}
.card{
 background:#191a20;border:1px solid #292a30;
 border-radius:13px;padding:19px;margin-bottom:15px;
}
h3{font-size:15px;color:#eee;margin-top:0}
button{
 background:#e33b42;color:white;border:0;
 border-radius:9px;padding:14px;
 font-weight:bold;width:100%;margin:6px 0;
}
button:active{opacity:.7}
.secondary{background:#292a32}
.status{color:#999;font-size:12px;margin:10px 0}
input[type=range]{width:100%;accent-color:#e33b42}
input[type=file]{width:100%;margin:12px 0}
label{display:flex;justify-content:space-between;
 color:#bbb;font-size:13px;margin:17px 0 8px}
footer{text-align:center;color:#777;font-size:12px;padding:25px}
</style>
</head>
<body>

<header>
 <div class="logo">LAITH <span>REVERB</span> PRO</div>
 <div class="sub">ADVANCED AUDIO SETTINGS</div>
</header>

<div class="container">

 <div class="card">
  <h3>MICROPHONE</h3>
  <button id="mic">تشغيل المايك</button>
  <div class="status" id="status">الميكروفون متوقف</div>
 </div>

 <div class="card">
  <h3>MASTER EFFECT</h3>
  <button id="effect">ENABLE EFFECT</button>
  <label>قوة الريفيرب <span id="rv">90%</span></label>
  <input id="reverb" type="range" min="0" max="100" value="90">
 </div>

 <div class="card">
  <h3>AUDIO PLAYER</h3>
  <input type="file" id="music" accept="audio/*">
  <button id="play" class="secondary">تشغيل الأغنية</button>
  <button id="pause" class="secondary">إيقاف الأغنية</button>
  <audio id="audio" crossorigin="anonymous"></audio>
 </div>

 <div class="card">
  <h3>SOUND CONTROL</h3>
  <label>الصوت الرئيسي <span id="volv">100%</span></label>
  <input id="volume" type="range" min="0" max="150" value="100">

  <label>BASS <span id="bassv">50%</span></label>
  <input id="bass" type="range" min="0" max="100" value="50">
 </div>

</div>

<footer>
تم التطوير بواسطة ليث<br>
LAITH AUDIO SYSTEM
</footer>

<script>
let ctx, mic, musicSource, master, convolver;
let dry, wet, bass, output;
let micStream, started=false, enabled=true;
const audio=document.getElementById("audio");

function impulse(seconds=8, decay=3.5){
 const rate=ctx.sampleRate;
 const length=rate*seconds;
 const buffer=ctx.createBuffer(2,length,rate);

 for(let c=0;c<2;c++){
  let data=buffer.getChannelData(c);
  for(let i=0;i<length;i++){
   let fade=Math.pow(1-i/length,decay);
   data[i]=(Math.random()*2-1)*fade;
  }
 }
 return buffer;
}

async function setup(){
 if(started)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();

 dry=ctx.createGain();
 wet=ctx.createGain();
 convolver=ctx.createConvolver();
 bass=ctx.createBiquadFilter();
 master=ctx.createGain();

 bass.type="lowshelf";
 bass.frequency.value=150;

 convolver.buffer=impulse(8,3.5);
 dry.gain.value=1;
 wet.gain.value=.9;
 master.gain.value=1;

 let mixer=ctx.createGain();

 // معالجة الصوت بدون مسار Echo
 dry.connect(mixer);
 convolver.connect(wet);
 wet.connect(mixer);
 mixer.connect(bass);
 bass.connect(master);
 master.connect(ctx.destination);

 started=true;
}

function connectSource(source){
 source.connect(dry);
 source.connect(convolver);
}

document.getElementById("mic").onclick=async()=>{
 try{
  await setup();
  if(ctx.state==="suspended")await ctx.resume();

  if(micStream){
   micStream.getTracks().forEach(t=>t.stop());
   micStream=null;
   document.getElementById("status").textContent="الميكروفون متوقف";
   document.getElementById("mic").textContent="تشغيل المايك";
   return;
  }

  micStream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:false
   }
  });

  mic=ctx.createMediaStreamSource(micStream);
  connectSource(mic);

  document.getElementById("status").textContent="الميكروفون يعمل";
  document.getElementById("mic").textContent="إيقاف المايك";

 }catch(e){
  document.getElementById("status").textContent="تعذر تشغيل المايك: "+e.message;
 }
};

document.getElementById("effect").onclick=async()=>{
 await setup();
 enabled=!enabled;
 dry.gain.value=enabled?1:1;
 wet.gain.value=enabled?Number(document.getElementById("reverb").value)/100:0;
 document.getElementById("effect").textContent=
 enabled?"EFFECT ENABLED":"EFFECT DISABLED";
};

document.getElementById("reverb").oninput=e=>{
 let v=Number(e.target.value);
 document.getElementById("rv").textContent=v+"%";
 if(wet&&enabled)wet.gain.value=v/100;
};

document.getElementById("volume").oninput=e=>{
 let v=Number(e.target.value);
 document.getElementById("volv").textContent=v+"%";
 if(master)master.gain.value=v/100;
};

document.getElementById("bass").oninput=e=>{
 let v=Number(e.target.value);
 document.getElementById("bassv").textContent=v+"%";
 if(bass)bass.gain.value=(v-50)*0.36;
};

document.getElementById("music").onchange=e=>{
 if(e.target.files[0]){
  audio.src=URL.createObjectURL(e.target.files[0]);
 }
};

document.getElementById("play").onclick=async()=>{
 await setup();
 if(ctx.state==="suspended")await ctx.resume();

 if(!musicSource){
  musicSource=ctx.createMediaElementSource(audio);
  connectSource(musicSource);
 }
 audio.play();
};

document.getElementById("pause").onclick=()=>audio.pause();
</script>
</body>
</html>
